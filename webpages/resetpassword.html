<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title> SideQuest | Reset password </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/my_tasks.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/login_signup.css') }}" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="brand auth-brand">
        <span class="brand-mark">TD</span>
        SideQuest
      </div>

      <h1>Choose a new password</h1>
      <p class="auth-sub">Use at least 8 characters. This link works once.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash-message flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form class="auth-form active" method="POST">
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new_password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters" required autofocus />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" placeholder="Repeat password" required />
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Reset password</button>
      </form>

      <a href="/login-signup" class="auth-back">&larr; Back to log in</a>

    </div>
  </div>

</body>
</html>
