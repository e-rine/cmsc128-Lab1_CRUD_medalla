<!-- Color theme (the user's chosen theme, set in My Quests) -->
<link rel="stylesheet" href="{{ url_for('static', filename='styles/themes.css') }}" />
{% if theme_css %}<style>{{ theme_css|safe }}</style>{% endif %}

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="SideQuest logo" class="brand-logo" /></span>
    SideQuest
  </div>

  <nav class="sidebar-nav">
    <a href="/homepage" class="{% if request.path == '/homepage' %}active{% endif %}">
      <span>Homepage</span>
    </a>
    <a href="/my-tasks" class="{% if request.path == '/my-tasks' and not request.args.get('list') %}active{% endif %}">
      <span>My Tasks</span>
    </a>
    <a href="/quests" class="{% if request.path.startswith('/quests') %}active{% endif %}">
      <span>My Quests</span>
    </a>
    <a href="/groups" class="{% if request.path.startswith('/groups') or (request.path == '/my-tasks' and request.args.get('list')) %}active{% endif %}">
      <span>My Groups</span>
    </a>
  </nav>

  <div class="sidebar-account">
    {% if session.get('user_id') %}
      <a href="/profile" class="sidebar-user{% if request.path.startswith('/profile') %} active{% endif %}" title="View profile">
        <span class="sidebar-avatar">{{ session.get('user_name', '?')[:1]|upper }}</span>
        <span class="sidebar-userinfo">
          <span class="sidebar-username">{{ session.get('user_name') }}</span>
        </span>
      </a>
      <a href="/logout" class="sidebar-logout">Log out</a>
    {% else %}
      <a href="/login-signup" class="sidebar-logout">Log in</a>
    {% endif %}
  </div>
</aside>
