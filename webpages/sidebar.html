<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">TD</span>
    SideQuest
  </div>

  <nav class="sidebar-nav">
    <a href="/homepage" class="{% if request.path == '/' %}active{% endif %}">
      <span>Homepage</span>
    </a>
    <a href="/my-tasks" class="{% if request.path == '/my-tasks' %}active{% endif %}">
      <span>My Tasks</span>
    </a>
  </nav>

  <div class="sidebar-account">
    {% if session.get('user_id') %}
      <a href="/profile" class="sidebar-user{% if request.path.startswith('/profile') %} active{% endif %}" title="View profile">
        <span class="sidebar-avatar">{{ session.get('user_name', '?')[:1]|upper }}</span>
        <span class="sidebar-userinfo">
          <span class="sidebar-username">{{ session.get('user_name') }}</span>
        </span>
      </a>
      <a href="/logout" class="sidebar-logout">Log out</a>
    {% else %}
      <a href="/login-signup" class="sidebar-logout">Log in</a>
    {% endif %}
  </div>
</aside>
